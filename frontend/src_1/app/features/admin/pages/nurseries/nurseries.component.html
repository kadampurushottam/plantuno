<app-admin-shell><div class="page-head"><div><small>BUSINESS PARTNERS</small><h1>Nurseries</h1><p>Review nursery partners, locations and ratings.</p></div><button class="primary">+ Add Nursery</button></div><div class="cards"><article *ngFor="let n of items"><div class="icon">🌿</div><div><h3>{{n.name}}</h3><p>{{n.locality}}, {{n.city}}</p><b>⭐ {{n.rating || 0}}</b><small>{{n.phone || 'Phone not added'}}</small></div><span [class.closed]="!n.openNow">{{n.openNow?'Open':'Closed'}}</span></article></div><div class="panel" *ngIf="loading">Loading nurseries...</div></app-admin-shell>
