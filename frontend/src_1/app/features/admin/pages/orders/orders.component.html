<app-admin-shell><div class="page-head"><div><small>ORDER MANAGEMENT</small><h1>Orders</h1><p>Track marketplace orders and update fulfilment status.</p></div><div class="filters"><input [(ngModel)]="q" placeholder="Search order/customer"/><select [(ngModel)]="status"><option>ALL</option><option>PLACED</option><option>CONFIRMED</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option></select></div></div><div class="panel table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Revenue</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody><tr *ngFor="let o of filtered"><td><b>#{{o._id|slice:-6}}</b></td><td>{{o.customer}}<small>{{o.email}}</small></td><td>{{o.items.length}}</td><td><b>₹{{o.total|number:'1.0-0'}}</b></td><td>{{o.paymentStatus}}</td><td><select [(ngModel)]="o.status" (change)="setStatus(o)"><option>PLACED</option><option>CONFIRMED</option><option>SHIPPED</option><option>DELIVERED</option><option>CANCELLED</option></select></td><td>{{o.createdAt|date:'dd MMM yyyy'}}</td></tr></tbody></table></div></app-admin-shell>
