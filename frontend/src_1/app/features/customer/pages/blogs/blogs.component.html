<app-customer-shell title="Blogs & Tips" subtitle="Practical advice for growing healthier plants at home.">
<div class="page-wrap"><div class="toast" *ngIf="message">{{message}}</div><div class="grid"><article class="card blog" *ngFor="let b of blogs"><div class="blog-img">{{b.icon}}</div><span class="tag">{{b.category}}</span><h3>{{b.title}}</h3><p>{{b.excerpt}}</p><a href="javascript:void(0)" (click)="notify('Article opened')">Read article →</a></article></div></div>
</app-customer-shell>
