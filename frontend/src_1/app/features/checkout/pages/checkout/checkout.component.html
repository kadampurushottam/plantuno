<main class="checkout"><div class="checkout-head"><a routerLink="/">← PlantUno</a><h1>Complete your order</h1></div><div *ngIf="success" class="success">{{success}} <span *ngIf="orderId">Order #{{orderId}}</span></div><div *ngIf="error" class="error">{{error}}</div><div *ngIf="!items.length && !success" class="empty"><h2>Your cart is empty</h2><p>Add a plant from the PlantUno landing page to continue.</p><a routerLink="/">Explore plants →</a></div><div class="checkout-grid" *ngIf="items.length"><section class="items"><article *ngFor="let item of items"><img [src]="item.image || 'assets/plant-placeholder.svg'" [alt]="item.name"><div class="details"><h3>{{item.name}}</h3><strong>₹{{item.price}}</strong><div class="qty"><button (click)="change(item,-1)" [disabled]="item.quantity<=1">−</button><span>{{item.quantity}}</span><button (click)="change(item,1)">+</button><button class="remove" (click)="remove(item)">Remove</button></div></div></article></section><aside><h2>Order summary</h2><div><span>Items</span><strong>{{cart.count}}</strong></div><div><span>Total</span><strong>₹{{cart.total}}</strong></div><button (click)="placeOrder()" [disabled]="submitting">{{submitting?'Placing order…':'Place Order'}}</button></aside></div></main>
