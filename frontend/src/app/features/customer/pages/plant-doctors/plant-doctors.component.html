<app-customer-shell title="Plant Doctors" subtitle="Get expert diagnosis and care guidance for your plants.">
<div class="page-wrap"><div class="toast" *ngIf="message">{{message}}</div><div class="row g-3"><div class="col-12 col-md-6 col-xl-4" *ngFor="let d of doctors"><article class="card service"><div class="doctor-avatar">🩺</div><div class="d-flex justify-content-between"><span class="tag">Plant Specialist</span><span>★ {{d.rating}}</span></div><h3>{{d.name}}</h3><p>{{d.speciality}}</p><div class="meta"><span>{{d.exp}} experience</span><strong>₹{{d.fee}}</strong></div><button class="primary" (click)="open(d)">Book Consultation</button></article></div></div></div>
<div class="modal-backdrop" *ngIf="selected" (click)="close()"><div class="booking" (click)="$event.stopPropagation()"><button class="close" (click)="close()">×</button><h2>Book {{selected.name}}</h2><p>{{selected.speciality}}</p><label>Date<input type="date" [(ngModel)]="booking.date"></label><label>Time<select [(ngModel)]="booking.time"><option>10:00</option><option>11:30</option><option>14:00</option><option>16:30</option><option>18:00</option></select></label><button class="primary w-100" (click)="confirm()">Confirm ₹{{selected.fee}}</button></div></div>
</app-customer-shell>
