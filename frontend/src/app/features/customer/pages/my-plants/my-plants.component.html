<app-customer-shell title="My Plants" subtitle="Your purchased plants and their care routine in one place.">
<div class="page-wrap"><div class="toast" *ngIf="message">{{message}}</div><div *ngIf="loading" class="empty">Loading your plant collection…</div><div class="alert alert-info" *ngIf="!loading&&!myPlants.length">Purchase a plant and it will appear here automatically.</div><div class="row g-3" *ngIf="!loading"><div class="col-12 col-sm-6 col-lg-4" *ngFor="let p of myPlants"><article class="card plant-progress"><div class="mini-img">🌿</div><div class="d-flex justify-content-between align-items-center"><h3>{{p.name}}</h3><span class="qty" *ngIf="p.quantity">×{{p.quantity}}</span></div><p>Next watering: {{p.next}}</p><div class="progress"><span [style.width.%]="p.progress"></span></div><small>{{p.progress}}% care complete</small><button class="secondary" *ngIf="p.quantity" (click)="careDone(p)">✓ Mark Care Done</button></article></div></div></div></app-customer-shell>
