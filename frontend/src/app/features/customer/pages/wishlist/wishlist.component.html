<app-customer-shell title="Wishlist" subtitle="Save plants you love and buy them when you're ready.">
<div class="container-fluid px-0"><div class="toast" *ngIf="message">{{message}}</div>
<div class="row g-3" *ngIf="items.length; else empty"><div class="col-12 col-sm-6 col-lg-3" *ngFor="let p of items"><article class="card h-100"><img [src]="p.image || 'assets/plant-placeholder.svg'" [alt]="p.name"><div class="p-3"><span class="tag">{{p.category}}</span><h3>{{p.name}}</h3><p>{{p.description || 'Healthy plant for your home.'}}</p><div class="d-flex justify-content-between align-items-center"><strong>₹{{p.price}}</strong><div><button class="icon-btn" (click)="remove(p._id)" title="Remove">♥</button><button class="buy" (click)="add(p)">Add to cart</button></div></div></div></article></div></div>
<ng-template #empty><div class="empty"><div>♡</div><h3>Your wishlist is empty</h3><p>Tap the heart on any plant to save it here.</p><a routerLink="/customer/plants">Explore plants</a></div></ng-template>
</div></app-customer-shell>
