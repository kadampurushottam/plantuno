<app-customer-shell title="Plants" subtitle="Healthy plants selected for your home, balcony and garden.">
<div class="page-wrap"><div class="toast" *ngIf="message">{{message}}</div><div class="alert alert-light border" *ngIf="error">{{error}}</div>
<div class="toolbar row g-2 align-items-center"><div class="col-12 col-lg"><div class="searchbox">⌕<input [(ngModel)]="query" (keyup.enter)="load()" placeholder="Search by plant, category or care requirement..."></div></div><div class="col-12 col-lg-auto"><select class="form-select" [(ngModel)]="sort"><option value="featured">Featured</option><option value="priceLow">Price: low to high</option><option value="priceHigh">Price: high to low</option><option value="name">Name</option></select></div></div>
<div class="chips"><button *ngFor="let c of categories" [class.selected]="selected===c" (click)="setCategory(c)">{{c}}</button></div>
<div *ngIf="loading" class="empty">Loading plants…</div><div class="row g-3" *ngIf="!loading"><div class="col-12 col-sm-6 col-lg-4 col-xl-3" *ngFor="let p of visible"><article class="card plant h-100"><div class="image-wrap"><img [src]="p.image || 'assets/plant-placeholder.svg'" [alt]="p.name"><button class="heart" (click)="toggleWishlist(p)">{{wishlist.has(p._id)?'♥':'♡'}}</button></div><div class="p-3 d-flex flex-column"><span class="tag">{{p.category}}</span><h3>{{p.name}}</h3><p>{{p.description || 'Beautiful plant for your space.'}}</p><div class="care"><span>☀ {{p.light||'Indirect'}}</span><span>💧 {{p.water||'Weekly'}}</span></div><div class="row-price"><strong>₹{{p.price}}</strong><div class="d-flex gap-1"><a class="details" [routerLink]="['/customer/plants',p._id]">View</a><button class="add" (click)="add(p)">🛒</button><button class="buy" (click)="buy(p)">Buy</button></div></div></div></article></div></div>
<div class="empty" *ngIf="!loading&&!visible.length"><h3>No plants found</h3><p>Try another search or category.</p></div></div></app-customer-shell>
