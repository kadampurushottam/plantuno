<app-customer-shell title="Nearby Nurseries" subtitle="Find trusted nurseries close to your locality.">
<div class="page-wrap"><div class="toolbar row g-2"><div class="col-12 col-lg"><input [(ngModel)]="query" placeholder="Search nursery or locality..."></div><div class="col-12 col-lg-auto"><button class="primary" (click)="detect()">📍 Detect My Location</button></div></div><div *ngIf="loading" class="empty">Finding nurseries near you…</div><div class="row g-3" *ngIf="!loading"><div class="col-12 col-md-6 col-xl-4" *ngFor="let n of visible"><article class="card"><div class="nursery-img">🌳</div><div class="p-2"><h3>{{n.name}}</h3><p>📍 {{n.locality||n.city||n.address||'Nearby'}}</p><p>⭐ {{n.rating||4.5}} · {{n.distanceKm||'-'}} km · {{n.openNow?'Open':'Check hours'}}</p><div class="actions"><a *ngIf="n.phone" [href]="'tel:'+n.phone">Call</a><a [href]="'https://www.google.com/maps/dir/?api=1&destination='+n.latitude+','+n.longitude" target="_blank">Navigate</a></div></div></article></div><div class="empty" *ngIf="!visible.length">No nearby nurseries found.</div></div><div class="toast" *ngIf="message">{{message}}</div></div>
</app-customer-shell>
