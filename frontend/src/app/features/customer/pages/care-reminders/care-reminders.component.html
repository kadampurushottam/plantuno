<app-customer-shell title="Care Reminders" subtitle="Never miss watering, feeding and plant-care tasks.">
<div class="page-wrap"><div class="toast" *ngIf="message">{{message}}</div><div class="reminders"><article class="reminder" *ngFor="let r of reminders" [class.completed]="r.done"><span class="reminder-icon">{{r.icon}}</span><div><h3>{{r.title}}</h3><p>{{r.plant}} · {{r.when}}</p></div><button class="secondary" (click)="done(r)" [disabled]="r.done">Done</button></article></div></div>
</app-customer-shell>
