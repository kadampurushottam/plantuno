<app-customer-shell title="Gardeners" subtitle="Book trusted gardeners for home, balcony and terrace care.">
<div class="page-wrap"><input class="search" [(ngModel)]="query" placeholder="Search gardener or service..."><div class="row g-3 mt-1"><div class="col-12 col-md-6 col-xl-4" *ngFor="let g of visible"><article class="card"><div class="avatar">👨‍🌾</div><span class="tag">★ {{g.rating}}</span><h3>{{g.name}}</h3><p>{{g.skill}}</p><small>{{g.experience}} years experience</small><div class="foot"><strong>₹{{g.fee}}</strong><button (click)="open(g)">Book Visit</button></div></article></div></div><div class="toast" *ngIf="message">{{message}}</div></div>
<div class="modal-backdrop" *ngIf="selected" (click)="close()"><div class="booking" (click)="$event.stopPropagation()"><button class="close" (click)="close()">×</button><h2>Book {{selected.name}}</h2><label>Date<input type="date" [(ngModel)]="date"></label><label>Time<select [(ngModel)]="time"><option>10:00</option><option>12:00</option><option>15:00</option><option>17:30</option></select></label><button class="primary w-100" (click)="confirm()">Confirm ₹{{selected.fee}}</button></div></div>
</app-customer-shell>
