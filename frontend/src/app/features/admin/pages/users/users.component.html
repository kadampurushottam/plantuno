<app-admin-shell><div class="page-head"><div><small>PLATFORM MANAGEMENT</small><h1>Users</h1><p>Manage customers, nursery owners and administrators.</p></div><input [(ngModel)]="q" placeholder="Search users..."/></div><div class="notice" *ngIf="msg">{{msg}}</div><div class="panel"><div class="loading" *ngIf="loading">Loading users...</div><div class="table-wrap" *ngIf="!loading"><table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Location</th><th>Joined</th><th>Action</th></tr></thead><tbody><tr *ngFor="let u of filtered"><td><b>{{u.name}}</b></td><td>{{u.email}}</td><td><select [(ngModel)]="u.role" (change)="changeRole(u)"><option value="customer">Customer</option><option value="nursery">Nursery</option><option value="admin">Admin</option></select></td><td>{{u.location?.locality || '—'}}, {{u.location?.city || '—'}}</td><td>{{u.createdAt|date:'dd MMM yyyy'}}</td><td><button class="btn">View</button></td></tr></tbody></table></div></div></app-admin-shell>
