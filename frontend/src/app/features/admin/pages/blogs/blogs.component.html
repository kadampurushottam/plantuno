<app-admin-shell><div class="page-head"><div><small>CONTENT MANAGEMENT</small><h1>Blogs & CMS</h1><p>Publish and manage marketplace content.</p></div><button class="primary" (click)="add()">+ Add New</button></div><div class="notice" *ngIf="message">{{message}}</div><div class="tools"><input [(ngModel)]="q" placeholder="Search blogs & cms..."/></div><div class="cards"><article *ngFor="let item of items | slice:0:12"><div class="icon">{{title==='Plant Doctors'?'⚕':title==='Appointments'?'◷':title==='Coupons'?'%':title==='Support Tickets'?'?':title==='Settings'?'⚙':'✦'}}</div><div><h3>{{item}}</h3><p>Active in PlantUno marketplace</p><span class="badge">Active</span></div><button class="ghost" (click)="toggle()">Manage</button></article></div></app-admin-shell>
