<div class="auth-shell">
  <!-- <div class="auth-brand" (click)="goHome()">🌱 Plant<span>Uno</span></div> -->
  <div class="auth-card">
    <div class="visual"><div class="leaf">🌿</div><h2>Welcome back.</h2><p>Sign in to continue your PlantUno journey.</p><div class="quote">“A little green can make a big difference.”</div></div>
    <div class="form-area">
      <a routerLink="/" class="back">← Back to PlantUno</a>
      <span class="eyebrow">ACCOUNT LOGIN</span>
      <h1>Sign in</h1>
      <p class="sub">Access your plants, nursery orders and more.</p>
      <div class="error" *ngIf="error">{{ error }}</div>
      <label>Email address<input type="email" [(ngModel)]="email" placeholder="you@example.com"></label>
      <label>Password<input type="password" [(ngModel)]="password" placeholder="••••••••"></label>
      <button class="submit" [disabled]="loading" (click)="submit()">{{loading?'Signing in...':'Sign In →'}}</button>
      <p class="switch">Don't have an account? <a routerLink="/register">Create one</a></p>
    </div>
  </div>
</div>
